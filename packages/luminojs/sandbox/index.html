<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lumino ClearScreen</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 1320px;
        margin: 24px auto;
        padding: 0 16px;
        color: #222;
      }
      #log {
        background: #111;
        color: #e0e0e0;
        padding: 12px;
        border-radius: 4px;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
        min-height: 120px;
        white-space: pre-wrap;
        overflow-y: auto;
        max-height: 300px;
      }
    </style>
  </head>
  <body>
    <h1>Lumino ClearScreen</h1>

    <canvas id="my_canvas" width="1280" height="720"
            style="border: 1px solid #999; display: block; margin: 16px 0;"></canvas>

    <h3>Log</h3>
    <div id="log"></div>

    <script type="module" src="./index.mjs"></script>
  </body>
</html>
